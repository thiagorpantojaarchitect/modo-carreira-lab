name: missao-1
on:
  push:
    paths: ["missoes/01-base/**", "scripts/**", ".github/workflows/missao-1.yml"]
  pull_request:
    paths: ["missoes/01-base/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  estrela:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 scripts/checar.py 1
